# Sensor parameters

ultrasonic_node:
  ros__parameters:
    serial_port: "/dev/ttyACM0"
    baudrate: 115200
    frame_id:  "ultrasonic_link"
    min_range: 0.02       # 2 cm
    max_range: 4.0        # 4 meters
    field_of_view: 0.52   # ~30 degrees
    update_rate: 10.0     # Hz

depthimage_to_laserscan:
  ros__parameters: 
    output_frame:  "camera_depth_frame"
    scan_time: 0.033      # 30 Hz
    range_min: 0.3        # meters
    range_max: 5.0        # meters
    scan_height: 1        # Rows to use from depth image